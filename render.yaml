# Service name deliberately left as-is (thebus-hernando-backend) even
# after the TriBus rename -- Render matches this Blueprint to the
# EXISTING live service by name, and the deployed URL
# (thebus-hernando-backend.onrender.com) is hardcoded as API_BASE in the
# already-shipped mobile app (frontend/www/js/sync.js). Renaming the
# service would need a coordinated frontend API_BASE change + new app
# release first, or every cached client breaks the moment this
# redeploys -- a real operational decision, not made here.
services:
  - name: thebus-hernando-backend
    type: web
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GTFS_FEED_URL_HERNANDO
        sync: false
      - key: GTFS_FEED_URL_PASCO
        sync: false
      - key: GTFS_FEED_URL_HART
        sync: false
      - key: REFRESH_SECRET
        sync: false
      - key: ETL_CRON
        sync: false
      # HART live vehicle positions via Swiftly's official real-time API
      # (see backend/.env.example). Optional -- leave unset and HART just
      # shows routes/stops with no live buses. SWIFTLY_HART_AGENCY_KEY is
      # only needed if HART's Swiftly agency key differs from the 'hart'
      # default.
      - key: SWIFTLY_API_KEY
        sync: false
      - key: SWIFTLY_HART_AGENCY_KEY
        sync: false
      # Cross-country trip planning (GET /api/plan). Both optional -- the
      # planner proxies the free Transitous/MOTIS network by default (no
      # key needed). Set TRIP_PLANNER_USER_AGENT to your own contact if you
      # deploy a fork; set TRANSITOUS_BASE_URL only to use a self-hosted
      # MOTIS instance. See backend/.env.example.
      - key: TRIP_PLANNER_USER_AGENT
        sync: false
      - key: TRANSITOUS_BASE_URL
        sync: false
      # Push notifications for followed-route alerts (optional). FCM_SERVICE_ACCOUNT
      # is the whole Firebase service-account JSON on one line; leave unset and
      # push is off (in-app/web notifications still work). See README.
      - key: FCM_SERVICE_ACCOUNT
        sync: false
      - key: PUSH_CHECK_CRON
        sync: false
      # Real datastore for the push token registry (optional but recommended
      # once push is on): attach a Render PostgreSQL instance and it injects
      # DATABASE_URL. Unset -> file fallback that resets on free-tier teardown.
      - key: DATABASE_URL
        sync: false
      # Keep-warm pinger so the crons keep firing on the free tier. Render
      # injects RENDER_EXTERNAL_URL automatically, so KEEP_WARM_URL is only
      # needed to override it; both optional.
      - key: KEEP_WARM_URL
        sync: false
      - key: KEEP_WARM_CRON
        sync: false
