name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install frontend dependencies
        run: npm install

      - name: Generate native Android project
        run: npx cap add android

      - name: Generate icon/splash assets
        run: npx capacitor-assets generate --android

      - name: Sync web assets into the native project
        run: npx cap sync android

      - name: Pin debug signing to a fixed keystore
        # Without this, the Android Gradle Plugin's IMPLICIT debug
        # signing config generates a NEW random keystore whenever it
        # doesn't already have one -- true on every fresh GitHub Actions
        # runner, so every build got signed with a different key. Android
        # treats a differently-signed APK as an unrelated app: installing
        # a new build over an old one gets refused or silently wipes app
        # storage (this is what caused "requires online sync" + an empty
        # map on every single fresh install/update). Pre-seeding
        # ~/.android/debug.keystore did NOT fix it -- verified by
        # comparing two real CI builds' cert fingerprints, which still
        # differed -- so this explicitly wires signingConfigs into the
        # generated build.gradle instead of relying on the implicit
        # convention resolving the way expected. Gradle allows multiple
        # `android {}` blocks in one file; this one merges in on top of
        # whatever `cap add android` already generated.
        run: |
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  debug {
                      storeFile file("${rootDir}/../keystore/debug.keystore")
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          EOF

      - name: Build debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: thebus-hernando-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
