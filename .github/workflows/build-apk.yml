name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    # `if:` conditionals can't reference `secrets` directly (the Actions
    # API rejects the workflow file outright -- "Unrecognized named-value:
    # 'secrets'" -- even for a step-level if, and even on an unrelated
    # trigger like workflow_dispatch), so gate on this job-level env var
    # instead, which CAN read secrets.
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install frontend dependencies
        run: npm install

      - name: Run frontend test suite
        run: npm test

      - name: Generate native Android project
        run: npx cap add android

      - name: Generate icon/splash assets
        run: npx capacitor-assets generate --android

      - name: Sync web assets into the native project
        run: npx cap sync android

      - name: Pin debug signing to a fixed keystore
        # Without this, the Android Gradle Plugin's IMPLICIT debug
        # signing config generates a NEW random keystore whenever it
        # doesn't already have one -- true on every fresh GitHub Actions
        # runner, so every build got signed with a different key. Android
        # treats a differently-signed APK as an unrelated app: installing
        # a new build over an old one gets refused or silently wipes app
        # storage (this is what caused "requires online sync" + an empty
        # map on every single fresh install/update). Pre-seeding
        # ~/.android/debug.keystore did NOT fix it -- verified by
        # comparing two real CI builds' cert fingerprints, which still
        # differed -- so this explicitly wires signingConfigs into the
        # generated build.gradle instead of relying on the implicit
        # convention resolving the way expected. Gradle allows multiple
        # `android {}` blocks in one file; this one merges in on top of
        # whatever `cap add android` already generated.
        run: |
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  debug {
                      storeFile file("${rootDir}/../keystore/debug.keystore")
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          EOF

      - name: Build debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: thebus-hernando-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ---- Release build (Play Store submission) ----
      # Only runs once the four secrets below are configured in this
      # repo's GitHub Actions secrets (Settings -> Secrets and variables
      # -> Actions). Until then this step is skipped entirely and the
      # debug build above is still produced as normal -- nothing breaks.
      #
      # DELIBERATELY NOT auto-generated by this workflow or by an
      # assistant: a release signing key is the one credential in this
      # whole project where losing it is unrecoverable -- lose it (or
      # its password) and you can NEVER publish another update to this
      # same Play Store listing under the same app; you'd have to ship a
      # brand new listing and lose every existing install/review/rating.
      # That is a decision + a secret only you should generate and hold.
      #
      # To set this up:
      #   1. Enroll this app in Google Play App Signing when you create
      #      its Play Console listing (Google's own recommended default
      #      now). With it, the key you generate below is only an
      #      "upload key" -- if it's ever lost or compromised, Google can
      #      reissue you a new one without losing the listing. Without
      #      Play App Signing, this key IS the permanent app signing key
      #      and there is no recovery path at all.
      #   2. Generate the upload key yourself, once, on your own machine
      #      (not in CI): `keytool -genkeypair -v -keystore upload-keystore.jks
      #      -alias thebus-upload -keyalg RSA -keysize 2048 -validity 9125`
      #      Store the resulting .jks file and its passwords somewhere
      #      durable and backed up -- a password manager plus an offline
      #      copy, not just this laptop.
      #   3. Add 4 repo secrets: RELEASE_KEYSTORE_BASE64 (the .jks file,
      #      base64-encoded: `base64 -w0 upload-keystore.jks`),
      #      RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD.
      - name: Build signed release bundle (Play Store)
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        working-directory: frontend
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/release.keystore
          cat >> android/app/build.gradle <<EOF

          android {
              signingConfigs {
                  release {
                      storeFile file("\${rootDir}/release.keystore")
                      storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("RELEASE_KEY_ALIAS")
                      keyPassword System.getenv("RELEASE_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
          cd android
          chmod +x gradlew
          # Play Store requires an Android App Bundle (.aab), not a raw
          # APK, for any app submitted since August 2021.
          ./gradlew bundleRelease
          rm -f release.keystore

      - name: Upload signed release bundle
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: thebus-hernando-release-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
